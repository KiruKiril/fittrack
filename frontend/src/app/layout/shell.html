<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" routerLink="/dashboard">
        <span class="brand-mark">FT</span>
        <span class="brand-name">fittrack</span>
      </a>

      <nav class="nav">
        <a routerLink="/dashboard" routerLinkActive="active">Übersicht</a>
        <a routerLink="/uebungen" routerLinkActive="active">Übungen</a>
        <a routerLink="/trainings" routerLinkActive="active">Trainings</a>
        <a routerLink="/splits" routerLinkActive="active">Splits</a>
        <a routerLink="/log" routerLinkActive="active">Verlauf</a>
      </nav>

      <div class="user">
        <span class="username">{{ username }}</span>
        <button class="btn btn-secondary btn-sm" (click)="logout()">Abmelden</button>
      </div>
    </div>
  </header>

  @if (liveSessionTracker.active(); as session) {
    <a class="live-banner" [routerLink]="['/trainings', session.trainingId, 'live']" [queryParams]="liveBannerQueryParams(session)">
      <span class="live-banner-dot"></span>
      <span class="live-banner-text">
        <strong>{{ session.trainingName }}</strong> läuft noch
      </span>
      <span class="live-banner-cta">Zurück zum Training →</span>
    </a>
  }

  <main class="content">
    <router-outlet />
  </main>

  <nav class="tabbar">
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>
      <span>Übersicht</span>
    </a>
    <a routerLink="/uebungen" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 8.5v7M17.5 8.5v7M2.5 11v2M21.5 11v2M6.5 10H4a1 1 0 0 0-1 1v0a1 1 0 0 0 1 1h2.5M17.5 10H20a1 1 0 0 1 1 1v0a1 1 0 0 1-1 1h-2.5M8.5 12h7"/></svg>
      <span>Übungen</span>
    </a>
    <a routerLink="/trainings" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4.5" width="16" height="15" rx="2"/><path d="M4 9h16M8.5 3v3M15.5 3v3"/></svg>
      <span>Trainings</span>
    </a>
    <a routerLink="/splits" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5 20.5 6 17 9.5M20.5 6H8a4.5 4.5 0 0 0-4.5 4.5v0M7 21.5 3.5 18 7 14.5M3.5 18H16a4.5 4.5 0 0 0 4.5-4.5v0"/></svg>
      <span>Splits</span>
    </a>
    <a routerLink="/log" routerLinkActive="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12.5" r="8"/><path d="M12 8v4.5l3 2M9 3h6"/></svg>
      <span>Verlauf</span>
    </a>
  </nav>
</div>
